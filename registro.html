<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crear cuenta - Buganvillias Bungalows</title>

    <link rel="stylesheet" href="estilos.css">

</head>

<body>

    <main class="login-container">

        <section class="login-card registro-card">

            <div class="login-logo">
                <span>🏡</span>
            </div>

            <h1>Buganvillias</h1>

            <p class="login-subtitulo">
                Bungalows
            </p>

            <h2>Crear una cuenta</h2>

            <p class="login-descripcion">
                Regístrate para realizar y gestionar tus reservas.
            </p>


            <form id="registroForm" class="login-form">

                <div class="registro-grid">


                    <!-- NOMBRES -->

                    <div class="campo-login">

                        <label for="nombres">
                            Nombres
                        </label>

                        <input
                            type="text"
                            id="nombres"
                            name="nombres"
                            placeholder="Tus nombres"
                            autocomplete="given-name"
                            required
                        >

                    </div>


                    <!-- APELLIDOS -->

                    <div class="campo-login">

                        <label for="apellidos">
                            Apellidos
                        </label>

                        <input
                            type="text"
                            id="apellidos"
                            name="apellidos"
                            placeholder="Tus apellidos"
                            autocomplete="family-name"
                            required
                        >

                    </div>


                    <!-- DNI -->

                    <div class="campo-login">

                        <label for="dni">
                            DNI
                        </label>

                        <input
                            type="text"
                            id="dni"
                            name="dni"
                            placeholder="8 dígitos"
                            maxlength="8"
                            inputmode="numeric"
                            autocomplete="off"
                            required
                        >

                    </div>


                    <!-- TELÉFONO -->

                    <div class="campo-login">

                        <label for="telefono">
                            Teléfono
                        </label>

                        <input
                            type="tel"
                            id="telefono"
                            name="telefono"
                            placeholder="999 999 999"
                            maxlength="9"
                            inputmode="numeric"
                            autocomplete="tel"
                            required
                        >

                    </div>


                    <!-- CORREO -->

                    <div class="campo-login campo-completo">

                        <label for="correo">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="correo@ejemplo.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- CONTRASEÑA -->

                    <div class="campo-login campo-completo">

                        <label for="password">
                            Contraseña
                        </label>

                        <div class="password-container">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Crea una contraseña"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                id="btnMostrarPassword"
                                class="btn-mostrar-password"
                                aria-label="Mostrar contraseña"
                            >
                                👁
                            </button>

                        </div>

                        <small class="ayuda-password">
                            Usa al menos 8 caracteres.
                        </small>

                    </div>

                </div>


                <button
                    type="submit"
                    id="btnRegistro"
                    class="btn-login"
                >
                    Crear cuenta
                </button>


                <p
                    id="mensajeRegistro"
                    class="login-mensaje"
                    aria-live="polite"
                ></p>

            </form>


            <div class="login-enlaces">

                <p>
                    ¿Ya tienes una cuenta?
                </p>

                <a
                    href="login.html"
                    class="crear-cuenta"
                >
                    Iniciar sesión
                </a>

                <div class="separador"></div>

                <a
                    href="index.html"
                    class="volver-inicio"
                >
                    ← Volver al inicio
                </a>

            </div>

        </section>

    </main>


    <script src="js/config.js"></script>
    <script src="js/registro.js"></script>

</body>

</html>
