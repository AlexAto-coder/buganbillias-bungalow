<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crear cuenta - Buganvillias Bungalows</title>

    <link rel="stylesheet" href="estilos.css">

</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <h1>Buganvillias Bungalows</h1>

            <h2>Crear cuenta</h2>

            <p class="login-descripcion">
                Regístrate para poder realizar y gestionar tus reservas.
            </p>

            <form id="registroForm" class="login-form">

                <label for="nombres">
                    Nombres
                </label>

                <input
                    type="text"
                    id="nombres"
                    name="nombres"
                    placeholder="Tus nombres"
                    required
                >

                <label for="apellidos">
                    Apellidos
                </label>

                <input
                    type="text"
                    id="apellidos"
                    name="apellidos"
                    placeholder="Tus apellidos"
                    required
                >

                <label for="dni">
                    DNI
                </label>

                <input
                    type="text"
                    id="dni"
                    name="dni"
                    placeholder="Tu DNI"
                    maxlength="8"
                    required
                >

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="correo@ejemplo.com"
                    required
                >

                <label for="telefono">
                    Teléfono
                </label>

                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="999999999"
                    required
                >

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Crea una contraseña"
                    required
                >

                <button
                    type="submit"
                    id="btnRegistro"
                >
                    Crear cuenta
                </button>

                <p
                    id="mensajeRegistro"
                    class="login-mensaje"
                    aria-live="polite"
                ></p>

            </form>

            <div class="login-enlaces">

                <p>
                    ¿Ya tienes una cuenta?
                </p>

                <a href="login.html">
                    Iniciar sesión
                </a>

                <p>
                    <a href="index.html">
                        ← Volver al inicio
                    </a>
                </p>

            </div>

        </section>

    </main>

    <script src="js/config.js"></script>
    <script src="js/registro.js"></script>

</body>

</html>
