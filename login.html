<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión - Buganvillias Bungalows</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <h1>Buganvillias Bungalows</h1>

            <h2>Iniciar sesión</h2>

            <p class="login-descripcion">
                Ingresa a tu cuenta para gestionar tus reservas.
            </p>

            <form id="loginForm" class="login-form">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="correo@ejemplo.com"
                    required
                >

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Tu contraseña"
                    required
                >

                <button type="submit" id="btnLogin">
                    Iniciar sesión
                </button>

                <p
                    id="mensajeLogin"
                    class="login-mensaje"
                    aria-live="polite"
                ></p>

            </form>

            <div class="login-enlaces">

                <p>
                    ¿No tienes una cuenta?
                </p>

                <a href="registro.html">
                    Crear una cuenta
                </a>

                <p>
                    <a href="index.html">
                        ← Volver al inicio
                    </a>
                </p>

            </div>

        </section>

    </main>

    <script src="js/config.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
