<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión - Buganvillias Bungalows</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="login-logo">
                <span>🏡</span>
            </div>

            <h1>Buganvillias</h1>

            <p class="login-subtitulo">
                Bungalows
            </p>

            <h2>Bienvenido nuevamente</h2>

            <p class="login-descripcion">
                Ingresa a tu cuenta para gestionar tus reservas.
            </p>

            <form id="loginForm" class="login-form">

                <div class="campo-login">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="correo@ejemplo.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="campo-login">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="btnMostrarPassword"
                            class="btn-mostrar-password"
                            aria-label="Mostrar contraseña"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    id="btnLogin"
                    class="btn-login"
                >
                    Iniciar sesión
                </button>


                <p
                    id="mensajeLogin"
                    class="login-mensaje"
                    aria-live="polite"
                ></p>

            </form>


            <div class="login-enlaces">

                <p>
                    ¿No tienes una cuenta?
                </p>

                <a
                    href="registro.html"
                    class="crear-cuenta"
                >
                    Crear una cuenta
                </a>

                <div class="separador"></div>

                <a
                    href="index.html"
                    class="volver-inicio"
                >
                    ← Volver al inicio
                </a>

            </div>

        </section>

    </main>


    <script src="js/config.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
